[package]
name = "spool-core"
description = "Identity state for Spool: types, changeset validation, reconciliation and an in-memory reference state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Describes the wire types with JSON Schema. The server enables it; nothing in
# the rules needs it.
schema = ["dep:schemars"]

[dependencies]
hex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
