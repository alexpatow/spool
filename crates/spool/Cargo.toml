[package]
name = "spool"
description = "The Spool engine: DuckDB store, project discovery, load, the built-in rule runner and metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Describes the types the API returns with JSON Schema.
schema = ["dep:schemars", "spool-core/schema"]

[dependencies]
dotenvy.workspace = true
duckdb.workspace = true
hex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
spool-core.workspace = true
thiserror.workspace = true
time.workspace = true

# To stop a strategy that ran out of time together with what it started.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
# For the tests that take a benchmark scenario as their fixture, and the
# helpers the crates' tests share. Both depend on the engine, which Cargo
# allows of a dependency of the tests alone.
spool-bench.workspace = true
spool-testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true
