[workspace]
resolver = "3"
members = ["crates/spool-core", "crates/spool", "crates/spool-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/alexpatow/spool"

[workspace.dependencies]
spool-core = { path = "crates/spool-core", version = "0.1.0" }
spool = { path = "crates/spool", version = "0.1.0" }

# The server's HTTP stack. Only spool-cli depends on it. http-body is the
# trait of a request's body, which the server wraps to read what was left of one.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
http-body = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# People and their sessions. Only spool-cli depends on these. Accounts are
# a SQLite file beside the store, passwords are hashed with Argon2, and the
# session cookie is tower-sessions'.
async-trait = "0.1"
getrandom = "0.3"
password-auth = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
# Sign-in with Google: the exchange with Google and the checks of what it
# answers. Its requests go out through ureq, so none of its HTTP clients.
openidconnect = { version = "4.1", default-features = false }

# The MCP endpoint: the official Rust SDK of the Model Context Protocol, for
# the protocol and its Streamable HTTP transport. Only spool-cli depends on it.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }

# duckdb re-exports the arrow version it was built against. Upgrade the two together.
# spool-cli names arrow itself for the IPC and JSON forms the server speaks.
arrow = { version = "60.1", default-features = false, features = ["ipc", "json"] }
duckdb = { version = "~1.20000.2", features = ["appender-arrow", "vtab-arrow"] }
# The CSV that `spool load` and the server read rows from. Only spool-cli
# depends on it: it says which line of a file is wrong, which a new user needs.
csv = "1.3"
# Named by spool-cli only so that its build script runs after the one that
# downloads the DuckDB library.
libduckdb-sys = "~1.20000.2"
# For two calls. spool-cli: a command whose output is piped to `head` ends
# quietly when the pipe closes. spool: a strategy that runs out of time is
# stopped with the processes it started.
libc = "0.2"
# Feature `schema` of the crates below: the JSON Schema of the API's types.
schemars = "1"
# A pattern extractor's expression. Its matching takes time in proportion
# to the text, whatever the expression. arrow already depends on it.
regex = "1"
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The YAML of a project: its sources and entity types.
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
# The commands that read from a running server. The build of the `duckdb`
# crate already depends on it, to download the DuckDB library.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1.29", features = ["serde", "v7"] }

# Hashing a password is made to be slow, and unoptimized it takes most of a
# second. A test signs in several times, and so does anyone who tries a
# server that was built for development.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
