[workspace]
resolver = "3"
members = ["crates/spool-core", "crates/spool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/alexpatow/spool"

[workspace.dependencies]
spool-core = { path = "crates/spool-core", version = "0.1.0" }

# duckdb re-exports the arrow version it was built against. Upgrade the two together.
duckdb = { version = "~1.20000.2", features = ["appender-arrow", "vtab-arrow"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
uuid = { version = "1.29", features = ["serde", "v7"] }
