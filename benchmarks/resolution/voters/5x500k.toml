# North Carolina voters, five sources of about 500,000 people each: the half
# of the register whose number is even, which is the same people in every
# source. 2,501,091 records of 1,750,491 people. See ../../datasets.toml.
#
# It takes about 8 GB of memory.

project = "."

[truth]
column = "recid"

[[step]]
name = "five sources"

[[step.ingest]]
dataset = "ncvoters_5"
member = "5Party-ocp20/ncvr_numrec_1000000_modrec_2_ocp_20_myp_0_nump_5.csv"
source = "party_0"
entity_type = "person"
where = "recid::BIGINT % 2 = 0"

[[step.ingest]]
dataset = "ncvoters_5"
member = "5Party-ocp20/ncvr_numrec_1000000_modrec_2_ocp_20_myp_1_nump_5.csv"
source = "party_1"
entity_type = "person"
where = "recid::BIGINT % 2 = 0"

[[step.ingest]]
dataset = "ncvoters_5"
member = "5Party-ocp20/ncvr_numrec_1000000_modrec_2_ocp_20_myp_2_nump_5.csv"
source = "party_2"
entity_type = "person"
where = "recid::BIGINT % 2 = 0"

[[step.ingest]]
dataset = "ncvoters_5"
member = "5Party-ocp20/ncvr_numrec_1000000_modrec_2_ocp_20_myp_3_nump_5.csv"
source = "party_3"
entity_type = "person"
where = "recid::BIGINT % 2 = 0"

[[step.ingest]]
dataset = "ncvoters_5"
member = "5Party-ocp20/ncvr_numrec_1000000_modrec_2_ocp_20_myp_4_nump_5.csv"
source = "party_4"
entity_type = "person"
where = "recid::BIGINT % 2 = 0"
