# The news items of `scenario.toml`, with an extractor that reads the labels.
#
# Every labelled mention becomes an observation and nothing else does, so
# extraction scores 1 by construction, and the rest of the report is what the
# company rules make of perfectly extracted mentions: resolution on its own.

project = "."

[truth]
mentions = "mentions.csv"

[[step]]
name = "batch one"

[[step.documents]]
dir = "documents/batch-1"
source = "news"

[[step.extract]]
extractor = "gold"

[[step]]
name = "batch two"

[[step.documents]]
dir = "documents/batch-2"
source = "news"

[[step.extract]]
extractor = "gold"
