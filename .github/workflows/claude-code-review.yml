name: Claude Code Review

# Claude reviews each pull request with the `code-review` plugin: several
# agents look for bugs and for breaks of a CLAUDE.md, a second pass checks
# each finding, and what survives is posted as inline comments, or as one
# comment saying nothing was found.
#
# The review runs once per pull request. The plugin stops when Claude has
# already commented, so a push to a reviewed pull request would start a run
# that does nothing: `synchronize` is not on the list. To have a later push
# reviewed, mention `@claude` on the pull request (see claude.yml).
#
# The action refuses to run a workflow whose file differs from the one on
# the default branch, so a change to this file is first tried on the pull
# request after the one that merges it.
#
# The paths are the ones ci.yml runs for: a change to the docs or the site
# alone is not reviewed.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**"
      - ".*"
      - ".*/**"
      - "!docs/**"
      - "!site/**"
      - "site/content/docs/cli-reference.mdx"
      - "site/src/styles/shelf/**"
      - "site/src/components/brand.tsx"
      - "site/src/app/icon.svg"
      - "!.github/workflows/site.yml"
      - "!README.md"
      - "!LICENSE"

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Drafts wait for `ready_for_review`. A pull request from a fork gets no
    # secrets, so it is skipped rather than failed.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The tools the plugin's command declares. With only the inline
          # comment tool allowed, it cannot read the pull request or post
          # its summary.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
