name: Claude Code Review

# Claude reviews each pull request with the `code-review` plugin: several
# agents look for bugs and for breaks of a CLAUDE.md, a second pass checks
# each finding, and what survives is posted as inline comments, or as one
# comment saying nothing was found.
#
# Every push is reviewed. The plugin by itself stops when Claude has already
# commented on the pull request, so the prompt tells it to go on, and to
# leave out what an earlier review has already raised. A push that turns up
# nothing new gets no comment. A newer push cancels a review still running.
#
# The action refuses to run a workflow whose file differs from the one on
# the default branch, so a change to this file is first tried on the pull
# request after the one that merges it.
#
# The paths are the ones ci.yml runs for: a change to the docs or the site
# alone is not reviewed.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**"
      - ".*"
      - ".*/**"
      - "!docs/**"
      - "!site/**"
      - "site/content/docs/cli-reference.mdx"
      - "site/src/styles/shelf/**"
      - "site/src/components/brand.tsx"
      - "site/src/app/icon.svg"
      - "!.github/workflows/site.yml"
      - "!README.md"
      - "!LICENSE"

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Drafts wait for `ready_for_review`. A pull request from a fork gets no
    # secrets, so it is skipped rather than failed.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # What follows the pull request is read by the command as part of
          # its arguments.
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            This run reviews the pull request as of commit ${{ github.event.pull_request.head.sha }}.
            In step 1, do not stop because Claude has already commented: a
            review runs on every push. Read the comments already on it, with
            `gh pr view ${{ github.event.pull_request.number }} --comments` and
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            for the inline ones, and do not post
            an issue that has already been raised, whether or not it was
            resolved. If an earlier review exists and this run finds no new
            issues, post no comment at all.
          # The tools the plugin's command declares, and reading this pull
          # request's inline comments. With only the inline comment tool
          # allowed, it cannot read the pull request or post its summary.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
