name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lints are errors here, and a new Rust release brings new lints. The
  # toolchain is named so that a release does not fail a build nobody changed.
  RUST_TOOLCHAIN: "1.98.1"
  # Each test binary carries the debug information of everything it links,
  # and with all of it the thirty of them fill the runner's disk. Line
  # numbers are kept, for a backtrace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      # The TypeScript client's tests run from `cargo test`, against the
      # binary it builds.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Python strategies are run with uv, which fetches what each one
      # depends on. Their tests run from `cargo test` too.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"

      # Public datasets are downloaded on first use and checked against the
      # checksums in datasets.toml.
      - uses: actions/cache@v6
        with:
          path: benchmarks/.cache
          key: datasets-${{ hashFiles('benchmarks/datasets.toml') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked -- --include-ignored

      # A build that outgrows the disk fails in whichever test writes next,
      # far from the cause. This says how near that is.
      - name: Disk left
        if: always()
        run: df -h /

  msrv:
    name: Build with the oldest supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `rust-version` in Cargo.toml, which is also what the Dockerfile builds with.
      - name: Install Rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked
