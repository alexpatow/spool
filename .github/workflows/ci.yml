name: CI

# Nothing these jobs build or test reads `docs/`, `site/`, or the `README.md`
# and `LICENSE` at the root, and the site's checks are a workflow of their
# own. A change to those alone starts none of these jobs, and a change to
# anything else as well starts them all. A test that comes to read one of
# them must take it off both lists, which are the same. `README.md` here is
# the one at the root: a crate's or a package's is not on the lists.
#
# The studio is built from the site's tokens, themes and mark, and its test
# checks that its copies of them are the site's: those files start the jobs.
# So does the command reference, which a test of `spool` checks is what the
# commands' help says.
# A later pattern wins over an earlier one, and files whose names begin
# with a dot, such as this one, are named on their own.
on:
  pull_request:
    paths:
      - "**"
      - ".*"
      - ".*/**"
      - "!docs/**"
      - "!site/**"
      - "site/content/docs/cli-reference.mdx"
      - "site/src/styles/shelf/**"
      - "site/src/components/brand.tsx"
      - "site/src/app/icon.svg"
      - "!.github/workflows/site.yml"
      - "!README.md"
      - "!LICENSE"
  push:
    branches: [main]
    paths:
      - "**"
      - ".*"
      - ".*/**"
      - "!docs/**"
      - "!site/**"
      - "site/content/docs/cli-reference.mdx"
      - "site/src/styles/shelf/**"
      - "site/src/components/brand.tsx"
      - "site/src/app/icon.svg"
      - "!.github/workflows/site.yml"
      - "!README.md"
      - "!LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lints are errors here, and a new Rust release brings new lints. The
  # toolchain is named so that a release does not fail a build nobody changed.
  RUST_TOOLCHAIN: "1.98.1"
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_LINUX_X64_SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
  # Each test binary carries the debug information of everything it links,
  # and with all of it they fill the runner's disk. Line numbers are kept,
  # for a backtrace, and only those of this workspace: see `Configure Cargo`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The jobs run side by side, and the slowest one is how long a push waits.
# What `cargo test --workspace -- --include-ignored` runs is divided among
# the `test` jobs: every test is in exactly one of them.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner comes with a Rust of its own, a newer one whenever its
      # image is renewed, and the key of the cache below covers every
      # toolchain that is installed. A job on a new image would find nothing
      # under its key and build everything, so the named one is the only one
      # left. The other jobs do the same.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list --quiet | { grep -v "^$RUST_TOOLCHAIN-" || true; } | xargs --no-run-if-empty rustup toolchain uninstall

      - name: Format
        run: cargo fmt --all -- --check

      # The `test` jobs divide the test files of the engine among them by
      # name, and those of the server. This reads the patterns they use and
      # fails unless every test file matches exactly one job of its kind,
      # and exactly one job of each kind takes the tests inside the crates.
      # It prints the job each file is in.
      - name: Every test file is in one job
        run: |
          export LC_ALL=C
          workflow=.github/workflows/ci.yml
          # A line for each job that names its files: its kind, its part
          # and its `targets`.
          rows=$(awk '/^ +- name: /{kind=$3; part=$4} /^ +targets: /{sub(/^ +targets: /, ""); print kind "\t" part "\t" $0}' "$workflow")
          failed=0
          for kind in engine server; do
            mine=$(awk -F'\t' -v kind="$kind" '$1 == kind' <<< "$rows")
            files=$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg kind "$kind" --arg root "$PWD/" '.packages[]
                | select((.name == "spool-cli") == ($kind == "server"))
                | .targets[] | select(.kind == ["test"])
                | "\(.name) \(.src_path | ltrimstr($root))"')
            if [ -z "$files" ] || [ -z "$mine" ]; then
              echo "::error file=$workflow::no $kind job names its test files, or there are none to name"
              failed=1
              continue
            fi
            while read -r file path; do
              jobs=0
              found=
              while IFS=$'\t' read -r _ part targets; do
                pattern=$(sed -nE "s/.*--test '([^']+)'.*/\1/p" <<< "$targets")
                # shellcheck disable=SC2053
                if [[ -n $pattern && $file == $pattern ]]; then
                  jobs=$((jobs + 1))
                  found="$found $kind $part"
                fi
              done <<< "$mine"
              echo "$path:${found:- no job}"
              if [ "$jobs" -ne 1 ]; then
                echo "::error file=$workflow::$path is in $jobs of the $kind jobs, and must be in exactly one"
                failed=1
              fi
            done <<< "$files"
            inside=$(grep -cE -- "--lib --bins( |$)" <<< "$mine" || true)
            if [ "$inside" -ne 1 ]; then
              echo "::error file=$workflow::the tests inside the crates are in $inside of the $kind jobs, and must be in exactly one"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "How the test files are divided, and how to mend this:"
            echo "  In $workflow, each 'engine' and 'server' job has a 'targets' line that"
            echo "  names its test files by their first letter, as in --test '[elu]*'. One job"
            echo "  of each kind takes every letter the others do not, as in --test '[!eilnsu]*',"
            echo "  and the tests inside the crates, with --lib --bins."
            echo "  - A new test file needs no change: it is in the job that has its first letter."
            echo "  - The pattern that begins with '!' must list exactly the letters that the"
            echo "    other jobs of its kind name, each once."
            echo "  - To move the files of a letter to another job, change that letter in the"
            echo "    patterns of both jobs, and keep the '!' pattern as above."
          fi
          exit "$failed"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # A failure in one part says nothing about the others.
      fail-fast: false
      matrix:
        # `packages` is what a job builds, and `tests` is which of its tests
        # it runs. The first two groups are named by what they leave out, so
        # that a new crate or a new test file is in one of them without
        # being added here. `spool` is built with the feature the server
        # turns on, as it is when the whole workspace is built.
        #
        # The tests of the engine are divided by test file, and so are the
        # server's, so that each job builds only the files it runs: `targets`
        # names them by their first letter, and one job of each kind takes
        # every letter the others do not, with the tests inside the crates
        # themselves. The jobs of a kind are of about the same length in
        # time, by the times of the tests when they were divided. The
        # engine's longest test by far is inside the crate, and its job has
        # the files with no long test of their own. The lint job checks that
        # every test file is in exactly one job.
        #
        # The stress tests and the studio's are each one Rust test that runs
        # the test files of a TypeScript package, and the longest in the
        # workspace. `stress` and `studio` say which part of those files a
        # job takes, and the test hands it to `bun test --shard`, which puts
        # every file in exactly one part. The rest of the studio's Rust tests
        # run once, with its first part. Neither package runs anything in
        # Python, so their jobs go without uv.
        #
        # Cargo builds a dependency with the features that what is being
        # built asks of it, so each group has dependencies of its own to
        # keep. `save` marks the job that keeps them.
        include:
          - name: engine 1/3
            cache: engine
            save: true
            documentation: true
            packages: --workspace --exclude spool-cli --features spool/schema
            targets: --lib --bins --examples --test '[!eilnsu]*'
          - name: engine 2/3
            cache: engine
            packages: --workspace --exclude spool-cli --features spool/schema
            targets: --test '[elu]*'
          - name: engine 3/3
            cache: engine
            packages: --workspace --exclude spool-cli --features spool/schema
            targets: --test '[ins]*'
          - name: server 1/3
            cache: server
            save: true
            documentation: true
            packages: -p spool-cli
            targets: --lib --bins --examples --test '[!c-ls]*'
            tests: -E 'not (binary_id(spool-cli::stress) | binary_id(spool-cli::studio))'
          - name: server 2/3
            cache: server
            packages: -p spool-cli
            targets: --test '[c-l]*'
            tests: -E 'not (binary_id(spool-cli::stress) | binary_id(spool-cli::studio))'
          - name: server 3/3
            cache: server
            packages: -p spool-cli
            targets: --test 's*'
            tests: -E 'not (binary_id(spool-cli::stress) | binary_id(spool-cli::studio))'
          - name: stress 1/2
            cache: server
            packages: -p spool-cli --test stress
            stress: 1/2
            without_uv: true
          - name: stress 2/2
            cache: server
            packages: -p spool-cli --test stress
            stress: 2/2
            without_uv: true
          - name: studio 1/2
            cache: server
            packages: -p spool-cli --test studio
            studio: 1/2
            without_uv: true
          - name: studio 2/2
            cache: server
            packages: -p spool-cli --test studio
            tests: -E 'test(=the_studio_this_binary_serves_is_built_from_its_source_and_passes_its_tests)'
            studio: 2/2
            without_uv: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list --quiet | { grep -v "^$RUST_TOOLCHAIN-" || true; } | xargs --no-run-if-empty rustup toolchain uninstall

      # Dependencies are built without debug information, which halves
      # what the cache below has to fetch and unpack. This is a file because
      # Cargo reads no such setting from the environment, and not an
      # argument because the stress tests run Cargo themselves.
      - name: Configure Cargo
        run: printf '[profile.dev.package."*"]\ndebug = false\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      # The key does not see the step above: change the number in it when
      # that step changes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-1-${{ matrix.cache }}
          save-if: ${{ matrix.save == true }}
          cache-bin: false

      # Runs each test in a process of its own, as many at a time as the
      # runner has cores, and divides the tests among jobs.
      - name: Install cargo-nextest
        run: |
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          printf '%s  %s\n' "$NEXTEST_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # The TypeScript packages' tests run from the Rust tests, against the
      # binary they build.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # Python strategies are run with uv, which fetches what each one
      # depends on. Their tests run from the Rust tests too.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !matrix.without_uv }}
        with:
          version: "0.13.8"

      # Public datasets are downloaded on first use and checked against the
      # checksums in datasets.toml. Each job keeps the ones its own tests
      # read: the newest copy it saved is the one restored.
      - name: Restore datasets
        id: datasets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/.cache
          key: datasets-${{ matrix.name }}-${{ hashFiles('benchmarks/datasets.toml') }}-
          restore-keys: datasets-${{ matrix.name }}-${{ hashFiles('benchmarks/datasets.toml') }}-

      - name: Build
        run: cargo nextest run --locked --no-run ${{ matrix.packages }} ${{ matrix.targets }}

      - name: Test
        env:
          SPOOL_STRESS_SHARD: ${{ matrix.stress }}
          SPOOL_STUDIO_SHARD: ${{ matrix.studio }}
        run: cargo nextest run --locked --run-ignored all --no-fail-fast ${{ matrix.packages }} ${{ matrix.targets }} ${{ matrix.tests }}

      # nextest does not run the examples in documentation.
      - name: Test the documentation
        if: matrix.documentation
        run: cargo test --doc --locked ${{ matrix.packages }}

      # Saved again when a test fetched a dataset the job did not have, which
      # happens when a test is added or moves from one job to another.
      - name: Save datasets
        if: hashFiles('benchmarks/.cache/**') != '' && !endsWith(steps.datasets.outputs.cache-matched-key, hashFiles('benchmarks/.cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/.cache
          key: datasets-${{ matrix.name }}-${{ hashFiles('benchmarks/datasets.toml') }}-${{ hashFiles('benchmarks/.cache/**') }}

      # A build that outgrows the disk fails in whichever test writes next,
      # far from the cause. This says how near that is.
      - name: Disk left
        if: always()
        run: df -h /

  msrv:
    name: Build with the oldest supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rust-version` in Cargo.toml, which is also what the Dockerfile builds with.
      - name: Install Rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
          rustup toolchain list --quiet | { grep -v "^$version-" || true; } | xargs --no-run-if-empty rustup toolchain uninstall

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false

      - name: Check
        run: cargo check --workspace --all-targets --locked
