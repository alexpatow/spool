name: Site

# The website and documentation in `site/`. Nothing else in the repository
# reads that directory, and the jobs in ci.yml leave it out, so a change to
# the site alone starts this workflow and no other.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # Started by hand, it also runs the commands in the pages against a binary
  # built from this commit. That builds the engine, which takes minutes, so
  # it is not part of every push: the author runs `bun run check:samples`
  # before a change to a page is pushed.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      # A change of more than 3,000 files is a mistake here, such as a
      # committed `node_modules`, and 3,000 is also where GitHub's list of a
      # pull request's files stops. It fails before anything is installed.
      - name: Refuse a change of more than 3,000 files
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .changed_files)
          echo "$changed files changed"
          if [ "$changed" -gt 3000 ]; then
            echo "::error::This pull request changes $changed files. More than 3,000 is refused."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      # Shelf's components are copied into the site as source. This fails if
      # one of them was edited, since an update would then overwrite the edit.
      - name: Check Shelf's files
        run: bunx shelf check

      - name: Type check
        run: bun run typecheck

      # The checks compare a page with what a command printed. These test
      # that comparing, which needs no engine.
      - name: Test the checks
        run: bun run test

      - name: Build
        run: bun run build

      # Every page has a description and is plain Markdown, every link and
      # fragment resolves, and llms.txt, llms-full.txt and each page's .md
      # are there and say what the page says.
      - name: Check the pages and the built site
        run: bun run check:site

  samples:
    name: Run the samples in the pages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: site-samples
          cache-bin: false

      - name: Build spool
        run: cargo build --release --locked -p spool-cli

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile

      # The pages run extractors that are Python files, which the server
      # runs with uv. The sample extractor asks a model that its first run
      # fetches. The script puts a file that needs no model in its place
      # unless SPOOL_TEST_MODEL is set, and it is not set here, so this job
      # fetches no model.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"

      - name: Run the samples
        working-directory: site
        run: bun run check:samples
